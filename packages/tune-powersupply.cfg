Description = Tune processor based on power supply state
    Maximum performance on battery power
Depends =
    udev

[/etc/scripts/tune-powersupply]
content =
 | #!/bin/sh
 | set -eu
 | # https://github.com/redhat-performance/tuned/blob/master/profiles/powersave/tuned.conf
 | # /etc/udev/rules.d/tune-powersupply.rules
 | 
 | if [ -z "${1-}" ]; then
 |   cat /sys/firmware/acpi/platform_profile
 |   exit 0
 | fi
